<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Muneeb ul Hassan — Data Scientist and Machine Learning Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1e"/>
      <stop offset="1" stop-color="#131c38"/>
    </linearGradient>
    <linearGradient id="curve" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#AA77FF"/>
      <stop offset="1" stop-color="#36BCF7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <style>
      .name { font: 700 50px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #f5f7ff; }
      .role { font: 500 22px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9fb3ff; }
      .mono { font: 400 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #7f8db3; }
      .accent { fill: #36BCF7; }
      .axis { font: 400 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #56638a; }
      .fit { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 3.2s ease-out 0.4s forwards; }
      .pts circle { opacity: 0; animation: fade 0.6s ease-out forwards; }
      .label { opacity: 0; animation: fade 0.8s ease-out 3.4s forwards; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>

  <!-- Identity -->
  <text x="64" y="132" class="name">Muneeb ul Hassan</text>
  <text x="66" y="174" class="role">Data Scientist · Machine Learning Engineer</text>
  <text x="66" y="228" class="mono"><tspan class="accent">&gt;</tspan> 7 years shipping ML to production · Paris</text>
  <text x="66" y="254" class="mono"><tspan class="accent">&gt;</tspan> building AI products on the side<tspan class="cursor accent">_</tspan></text>

  <!-- Training-curve motif -->
  <g transform="translate(24,0)">
    <line x1="660" y1="270" x2="1140" y2="270" stroke="#2a3558"/>
    <line x1="660" y1="60" x2="660" y2="270" stroke="#2a3558"/>
    <text x="1140" y="290" text-anchor="end" class="axis">experience →</text>
    <text x="650" y="64" text-anchor="end" class="axis">loss</text>

    <g class="pts" fill="#AA77FF" fill-opacity="0.55">
      <circle cx="680" cy="104" r="3.5" style="animation-delay:.10s"/>
      <circle cx="705" cy="141" r="3.5" style="animation-delay:.18s"/>
      <circle cx="730" cy="166" r="3.5" style="animation-delay:.26s"/>
      <circle cx="755" cy="192" r="3.5" style="animation-delay:.34s"/>
      <circle cx="785" cy="203" r="3.5" style="animation-delay:.42s"/>
      <circle cx="815" cy="226" r="3.5" style="animation-delay:.50s"/>
      <circle cx="845" cy="224" r="3.5" style="animation-delay:.58s"/>
      <circle cx="875" cy="241" r="3.5" style="animation-delay:.66s"/>
      <circle cx="905" cy="236" r="3.5" style="animation-delay:.74s"/>
      <circle cx="935" cy="249" r="3.5" style="animation-delay:.82s"/>
      <circle cx="965" cy="244" r="3.5" style="animation-delay:.90s"/>
      <circle cx="995" cy="254" r="3.5" style="animation-delay:.98s"/>
      <circle cx="1025" cy="250" r="3.5" style="animation-delay:1.06s"/>
      <circle cx="1055" cy="257" r="3.5" style="animation-delay:1.14s"/>
      <circle cx="1085" cy="253" r="3.5" style="animation-delay:1.22s"/>
      <circle cx="1115" cy="259" r="3.5" style="animation-delay:1.30s"/>
    </g>

    <path class="fit" d="M672 84 C 740 190, 810 228, 900 243 S 1060 256, 1130 258"
          fill="none" stroke="url(#curve)" stroke-width="3.5" stroke-linecap="round"/>

    <g class="label">
      <circle cx="1130" cy="258" r="5" fill="#36BCF7"/>
      <rect x="1000" y="206" width="126" height="28" rx="6" fill="#0a0f1e" stroke="#36BCF7" stroke-opacity="0.5"/>
      <text x="1063" y="225" text-anchor="middle" class="axis" style="fill:#36BCF7">converged ✓</text>
    </g>
  </g>
</svg>
